[project]
name = "nexflow-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "celery[redis]>=5.3.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "redis>=5.0.0",
    "weasyprint>=62.0",
    "boto3>=1.34.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.0.0",
    "python-multipart>=0.0.9",
    "sendgrid>=6.11.0",
    "twilio>=9.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "types-redis>=4.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "UP042",  # replace-str-enum: requires StrEnum (Python 3.11+); tracked for cleanup
    "E741",   # ambiguous-variable-name: low-value in test/migration context
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501", "F401"]
"tests/*" = ["E501"]
"app/*" = ["E501"]  # tracked for cleanup in EUR-1312

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# strict mode disabled: 91 annotation errors tracked in EUR-1312 for incremental cleanup
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
