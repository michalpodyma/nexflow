name: Build & Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker build
        run: docker build -t nexflow-api-verify backend/

  deploy-to-railway:
    needs: build-verify
    runs-on: ubuntu-latest
    steps:
      - name: Validate Railway API key
        run: |
          WHOAMI=$(curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "query { me { id email } }"}')
          echo "Railway auth check: $WHOAMI"
          if echo "$WHOAMI" | grep -q '"Not Authorized"'; then
            echo "::error::RAILWAY_API_KEY is expired or invalid."
            echo "::error::Fix: Go to railway.app → Account → API Tokens → generate a new token,"
            echo "::error::then update the RAILWAY_API_KEY secret in GitHub repo Settings → Secrets → Actions."
            echo "::error::After updating, re-run this workflow via Actions → workflow_dispatch."
            exit 1
          fi

      - name: Trigger Railway repo-source deploy
        run: |
          # Tell Railway to build from the latest GitHub commit (repo-source build)
          # Project: nexflow-backend | Service: nexflow-api | Env: production
          RESPONSE=$(curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation { serviceInstanceDeploy(serviceId: \\\"5a9e7de6-f465-410b-a89e-227f22b5870b\\\", environmentId: \\\"9caf3892-adbc-48a0-bedc-5dd72db30fbb\\\", latestCommit: true) }\"
            }")
          echo "Railway response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"serviceInstanceDeploy":true' || (echo "Deploy trigger failed" && exit 1)
