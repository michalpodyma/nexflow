name: Build & Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker build
        run: docker build -t nexflow-api-verify backend/

  deploy-to-railway:
    needs: build-verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway repo-source deploy
        run: |
          # Tell Railway to build from the latest GitHub commit (repo-source build)
          # Project: nexflow-backend | Service: nexflow-api | Env: production
          RESPONSE=$(curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation { serviceInstanceDeploy(serviceId: \\\"88ee6afe-6f74-4fbd-8d7d-f5ad300a141c\\\", environmentId: \\\"221b985d-cbb1-4283-b0ca-cd786b4d036c\\\", latestCommit: true) }\"
            }")
          echo "Railway response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"serviceInstanceDeploy":true' || (echo "Deploy trigger failed" && exit 1)
