name: Build & Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker build
        run: docker build -t nexflow-api-verify backend/

  deploy-to-railway:
    needs: build-verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway repo-source deploy
        run: |
          # Tell Railway to build from the latest GitHub commit (repo-source build)
          # Railway builds from the connected repo directly — no GHCR needed
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation { serviceInstanceDeploy(serviceId: \\\"${{ secrets.RAILWAY_SERVICE_ID }}\\\", environmentId: \\\"${{ secrets.RAILWAY_ENV_ID }}\\\", latestCommit: true) }\"
            }"
